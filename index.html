<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Auth System</title>
    <!-- Stable fallback CDN provider to prevent connection timeouts -->
    <script src="https://unpkg.com/@supabase/supabase-js/"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        .screen { display: none; }
        .screen.active { display: block; }
        h2 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3ecf8e; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background: #34b279; }
        .btn-github { background: #24292e; margin-top: 10px; }
        .btn-github:hover { background: #1a1e22; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; }
        .toggle-link span { color: #3ecf8e; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-container">
    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="screen active">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email Address">
        <input type="password" id="login-password" placeholder="Password">
        <button id="btn-login">Log In</button>
        <button id="btn-github-login" class="btn-github">Sign In with GitHub</button>
        <div class="toggle-link" id="go-to-signup">Don't have an account? <span>Create one</span></div>
    </div>

    <!-- 2. SIGNUP SCREEN -->
    <div id="signup-screen" class="screen">
        <h2>Create Account</h2>
        <input type="email" id="signup-email" placeholder="Email Address">
        <input type="password" id="signup-password" placeholder="Password">
        <button id="btn-signup">Sign Up</button>
        <button id="btn-github-signup" class="btn-github">Sign Up with GitHub</button>
        <div class="toggle-link" id="go-to-login">Already have an account? <span>Log In</span></div>
    </div>

    <!-- 3. VERIFICATION SCREEN -->
    <div id="verify-screen" class="screen">
        <h2>Enter Verification Code</h2>
        <p style="font-size: 14px; color: #555;">We sent a 6-digit code to your email.</p>
        <input type="text" id="verify-code" placeholder="6-Digit Token">
        <button id="btn-verify">Verify Email</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
